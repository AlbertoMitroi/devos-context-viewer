# Publishes the viewer to GitHub Pages (https://<owner>.github.io/devos-context-viewer/) with the public lab only:
# the five repository generations and the lab system generation (context-systems:lab-main, shown as "devos-lab").
# Each is pulled from GHCR with ORAS, checked against its manifest-sha256 layer annotation and served as static
# files (src/model/source.ts staticSource); repository sources come from raw.githubusercontent.com, at each input's
# commit for the system. repository_dispatch "context-published" lets the lab repositories (and devos-lab, after
# publishing the system generation) redeploy the site.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [context-published]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Build under the Pages path
        env:
          VIEWER_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      # Anonymous pulls: the lab context packages are public.
      - name: Pull the lab generations
        run: |
          scripts/pull-lab-generations.sh dist/generations "${GITHUB_REPOSITORY_OWNER,,}" | tee pulled.txt
          node scripts/static-index.mjs dist/generations
          {
            echo "### Lab generations (repositories and the devos-lab system)"
            echo '```'
            cat pulled.txt
            echo '```'
            echo "Site size: $(du -sh dist | cut -f 1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          # Generated sources live under .dotnet-intelligence/ inside the generations (evidence store "generation").
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
